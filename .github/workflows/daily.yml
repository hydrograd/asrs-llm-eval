name: daily-run

# Collection phase: each day, spend that day's free-tier allowance on the next jobs in the
# frozen plan and commit the traces. Collection finished on 17 November 2026, so the schedule
# has been removed and this runs only when started by hand (Actions tab -> daily-run -> Run
# workflow), e.g. after adding jobs to the plan. Drift monitoring continues in weekly.yml.
#
# While collecting it ran every 3 hours ("23 */3 * * *"): GitHub skipped or delayed a single
# daily slot by 5-8 hours on 10 and 11 November. Budgets are counted from the committed traces
# in each provider's quota day (Groq: UTC; Gemini: Pacific, resets 08:00 UTC), so only the
# first run after a reset did work; later runs found nothing left and committed nothing.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experiment-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: pytest -q
      - name: Run today's batch
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/run_experiment.py --max-minutes 300
          python scripts/run_experiment.py --status
      - name: Rebuild results.json
        run: python scripts/make_report.py
      - name: Commit if there are new traces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # After collection completes there is nothing to run; skip the commit rather than
          # recommitting results.json with only a new timestamp.
          if [ -z "$(git status --porcelain -- results/traces)" ]; then echo "no new traces"; exit 0; fi
          git add results/
          git commit -m "Daily run $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
