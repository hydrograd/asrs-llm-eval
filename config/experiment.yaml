# Every headline number must be reproducible from this file.
seed: 42

data:
  raw_dir: data/raw              # every *.csv export here is merged, de-duplicated on ACN
  start: "2022-01"               # drops stray out-of-window reports the export includes
  end: "2026-11"
  target: primary_problem        # single-label target
  min_class_count: 30            # rarer classes folded into "Other"
  test_size: 0.2                 # LLM items are drawn only from the test pool

# Cutoffs are month-level; the cutoff month itself is excluded from both sides.
models:
  - name: openai/gpt-oss-120b
    provider: groq
    training_cutoff: "2024-06"
    cutoff_source: "https://arxiv.org/html/2508.10925 §2.4: 'Our model has a knowledge cutoff of June 2024.'"
  - name: openai/gpt-oss-20b
    provider: groq
    training_cutoff: "2024-06"
    cutoff_source: "https://arxiv.org/html/2508.10925 §2.4 (same model card covers both sizes)"
  - name: gemini-3.8-flash
    provider: gemini
    # Card: "knowledge cutoff date ... is March 2026" but "in others ... limited to January 2025".
    # Three zones: before 2025-01, 2025-01..2026-03 (ambiguous), after 2026-03 (Apr-Aug 2026 data).
    training_cutoff: "2026-03"
    training_cutoff_partial: "2025-01"
    cutoff_source: "https://deepmind.google/models/model-cards/gemini-3-8-flash/"

sampling:
  n_eval: 300                    # per split; sized to free-tier token budgets
  n_stability_items: 30
  n_stability_runs: 10
  temperature: 0.0

retrieval:
  k_examples: 5

bootstrap:
  n_resamples: 2000
  ci: 0.95
