[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asrs-eval"
version = "0.1.0"
description = "Do LLMs agree with expert aviation safety coders? An evaluation harness on NASA ASRS reports."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
llm = ["groq>=0.9", "google-genai>=1.0"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0"]
# Only for scripts/build_dense_index.py; the runner reads its committed output.
dense = ["sentence-transformers>=5.0", "torch>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
